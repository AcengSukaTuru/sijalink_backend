services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sijalink
      POSTGRES_USER: sijalink
      POSTGRES_PASSWORD: sijalink_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sijalink -d sijalink']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
