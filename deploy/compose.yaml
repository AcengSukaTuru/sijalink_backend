services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      # API sengaja bind ke semua interface agar bisa diakses FE via LAN/NAT router.
      - '${HOST_API_PORT:-3000}:3000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sijalink}
      POSTGRES_USER: ${DB_USER:-sijalink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sijalink_prod}
    ports:
      # Database tidak perlu dibuka ke internet; ubah hanya jika admin lokal butuh akses.
      - '127.0.0.1:${DB_HOST_PORT:-15432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-sijalink} -d ${DB_NAME:-sijalink}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # 9000 dipakai Portainer di host. MinIO gunakan port host terpisah.
      - '${MINIO_HOST_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-19001}:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
